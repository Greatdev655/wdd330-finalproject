<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="A Book Tracker app that lets users search for books and track their reading habits using the Google Books and Open Library APIs." />
  <meta name="author" content="Ikechukwu Great (GreatDev)" />
  <meta property="og:title" content="BookTracker — My Library" />
  <meta property="og:description" content="Track your currently reading and finished books with Book Tracker." />
  <meta property="og:image" content="https://Greatdev655.github.io/wdd231/chamber/images/og-image.jpg" />
  <meta property="og:url" content="https://Greatdev655.github.io/wdd330-finalproject/library.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <link rel="icon" href="assets/images/favicon (2).ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script type="module" src="js/header-footer.js"></script>
  <script type="module" src="js/library.js"></script>

  <title>Book Tracker : My Library</title>
</head>
<body>

   <header id="site-header">
    <!-- injected using js -->
  </header>

  <main>
    <h1>My Library</h1>

    <div id="filter-tabs">
      <button type="button" data-filter="reading" class="filter-tab active">Currently Reading</button>
      <button type="button" data-filter="finished" class="filter-tab">Finished</button>
    </div>

    <p id="library-state-message"></p>

    <div id="library-container">
      <!-- Library book cards get rendered here by library.js -->
    </div>
  </main>

  <footer id="site-footer">
    <!-- injected using js -->
     </footer>

</body>
</html>
